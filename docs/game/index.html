<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>HoloBridge VR | Multi-Device Spatial Hub</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/mqtt.min.js"></script>
    <script>
      // Safe Global Module Initialization
      window.Module = window.Module || {};
      var Module = window.Module;

      // Register PWA Service Worker for 0-Bandwidth Unlimited Opens
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').then(function(reg) {
            console.log('[HoloBridge PWA] Service Worker Active (0-Bandwidth Cached):', reg.scope);
          }).catch(function(e) {
            console.warn('[HoloBridge PWA] SW registration notice:', e);
          });
        });
      }
    </script>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #060b14;
        overflow: hidden;
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        color: #e2e8f0;
        user-select: none;
        -webkit-user-select: none;
      }
      #unity-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #0a0f1d;
      }

      /* Semi-transparent Cyberpunk Spatial Hub Overlay */
      #spatialHubOverlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        z-index: 10;
      }

      /* Embedded Mode when running inside Controller Hub Viewport */
      body.embedded-mode #spatialHubOverlay {
        display: none !important;
      }
      body.embedded-mode #embeddedBadge {
        display: block !important;
      }
      #embeddedBadge {
        display: none;
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 20;
        background: rgba(6,11,20,0.85);
        border: 1px solid #00ff88;
        color: #00ff88;
        font-size: 10px;
        font-weight: 800;
        padding: 3px 8px;
        border-radius: 4px;
        letter-spacing: 0.5px;
        pointer-events: none;
      }

      /* Top Cyber Ribbon */
      .top-hub-bar {
        pointer-events: auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 16px;
        background: rgba(8, 16, 28, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1.5px solid rgba(0, 229, 255, 0.35);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.55);
      }
      .brand-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.6px;
        color: #00e5ff;
        text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
      }
      .beacon {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #00ff88;
        box-shadow: 0 0 8px #00ff88;
        animation: pulse 1.6s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.85); }
      }

      .btn-cluster {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .hub-btn {
        background: rgba(14, 28, 48, 0.85);
        border: 1px solid rgba(0, 229, 255, 0.45);
        color: #94a3b8;
        font-size: 11px;
        font-weight: 700;
        padding: 6px 11px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.18s ease;
      }
      .hub-btn:hover {
        background: rgba(0, 229, 255, 0.22);
        color: #ffffff;
        border-color: #00e5ff;
        box-shadow: 0 0 10px rgba(0, 229, 255, 0.35);
      }
      .hub-btn.active {
        background: linear-gradient(135deg, rgba(0, 229, 255, 0.32), rgba(0, 255, 136, 0.32));
        color: #00ff88;
        border-color: #00ff88;
        box-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
      }
      .hub-btn.action {
        border-color: rgba(255, 170, 0, 0.55);
        color: #ffaa00;
      }
      .hub-btn.action:hover {
        background: rgba(255, 170, 0, 0.25);
        color: #ffffff;
      }

      /* 1-Finger Virtual Touch Joystick (Bottom Left) */
      #touchJoystickZone {
        pointer-events: auto;
        position: absolute;
        bottom: 24px;
        left: 20px;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 229, 255, 0.12) 0%, rgba(10, 20, 36, 0.72) 75%);
        border: 2px solid rgba(0, 229, 255, 0.55);
        box-shadow: 0 0 20px rgba(0, 229, 255, 0.25), inset 0 0 15px rgba(0, 229, 255, 0.15);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        touch-action: none;
        user-select: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #joystickThumb {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: radial-gradient(circle, #00ff88 25%, #009955 85%);
        border: 2px solid #ffffff;
        box-shadow: 0 0 16px rgba(0, 255, 136, 0.7);
        position: absolute;
        pointer-events: none;
        transform: translate(0px, 0px);
        transition: transform 0.04s ease-out;
      }
      .joystick-label {
        position: absolute;
        bottom: -22px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        font-weight: 700;
        white-space: nowrap;
        color: #38bdf8;
        text-shadow: 0 0 6px rgba(0, 229, 255, 0.6);
        pointer-events: none;
      }

      /* Bottom Right Quick Controls */
      .bottom-quick-bar {
        pointer-events: auto;
        position: absolute;
        bottom: 20px;
        right: 20px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .quick-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(14, 28, 48, 0.88);
        border: 1.5px solid rgba(0, 229, 255, 0.5);
        color: #00e5ff;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        transition: all 0.16s ease;
      }
      .quick-btn:hover {
        transform: scale(1.08);
        border-color: #00ff88;
        color: #00ff88;
        box-shadow: 0 0 14px rgba(0, 255, 136, 0.5);
      }

      /* Notification Toast */
      #hudToast {
        position: absolute;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(10, 25, 45, 0.92);
        border: 1px solid #00ff88;
        color: #00ff88;
        font-size: 12px;
        font-weight: 700;
        padding: 6px 16px;
        border-radius: 20px;
        box-shadow: 0 0 15px rgba(0, 255, 136, 0.45);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s ease;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <!-- Integrated Spatial Hub HUD Overlay -->
      <div id="spatialHubOverlay">
        <!-- Top Cyber Ribbon -->
        <div class="top-hub-bar">
          <div class="brand-title">
            <span class="beacon"></span>
            <span>HOLOBRIDGE SPATIAL HUB</span>
          </div>

          <!-- Camera Perspectives -->
          <div class="btn-cluster">
            <button class="hub-btn active" id="btn_first_person" onclick="setCameraView('first_person')">🖥️ 1ST PERSON</button>
            <button class="hub-btn" id="btn_third_person" onclick="setCameraView('third_person')">👤 3RD PERSON</button>
            <button class="hub-btn" id="btn_birds_eye" onclick="setCameraView('birds_eye')">🦅 BIRD'S EYE VIEW</button>
            <button class="hub-btn" id="btn_arena" onclick="setCameraView('arena')">🌐 ARENA CAM</button>
          </div>

          <!-- Scene Actions & Competition Tour -->
          <div class="btn-cluster">
            <button class="hub-btn action" onclick="triggerAction('theme')">🎨 THEME</button>
            <button class="hub-btn action" onclick="triggerAction('explode')">💥 EXPLODE</button>
            <button class="hub-btn action" onclick="triggerAction('role')">🔀 ROLE</button>
            <button class="hub-btn" style="background:linear-gradient(135deg, rgba(255,170,0,0.35), rgba(255,0,128,0.35)); border-color:#ffaa00; color:#ffdd00;" onclick="startCinematicTour()">🏆 JUDGES TOUR</button>
          </div>
        </div>

        <div id="embeddedBadge">🔴 3D LIVE SPECTATOR VIEWPORT</div>

        <!-- 1-Finger Virtual Touch Joystick (Bottom Left) -->
        <div id="touchJoystickZone">
          <div id="joystickThumb"></div>
          <div class="joystick-label">👆 1-FINGER JOYSTICK</div>
        </div>

        <!-- Bottom Right Floating Controls -->
        <div class="bottom-quick-bar">
          <button class="quick-btn" title="Toggle Bird's Eye View" onclick="setCameraView('birds_eye')">🦅</button>
          <button class="quick-btn" title="Toggle 3rd Person View" onclick="setCameraView('third_person')">👤</button>
          <button class="quick-btn" id="btnFullscreen" title="Toggle Fullscreen" onclick="toggleFullscreen()">⛶</button>
        </div>

        <!-- Live Toast Notification -->
        <div id="hudToast"></div>
      </div>

      <!-- Unity Loading Bar Container -->
      <div id="unity-fullscreen-container" style="display:none;"></div>
      <div id="unity-loading-container" style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#060b14; z-index:50;">
        <div style="font-size:22px; font-weight:800; color:#00e5ff; letter-spacing:1px; margin-bottom:14px; text-shadow:0 0 12px rgba(0,229,255,0.6);">
          🌐 INITIALIZING HOLOBRIDGE SPATIAL HUB
        </div>
        <div style="width:280px; height:8px; background:rgba(255,255,255,0.12); border-radius:4px; overflow:hidden; border:1px solid rgba(0,229,255,0.4);">
          <div id="unity-progress-bar-full" style="width:0%; height:100%; background:linear-gradient(90deg, #00e5ff, #00ff88); transition:width 0.2s;"></div>
        </div>
        <div style="margin-top:12px; font-size:12px; color:#94a3b8;">Spawning Articulated Avatars & Spatial Locomotion...</div>
      </div>

      <div id="unity-warning" style="position:absolute; top:10px; left:10px; z-index:100;"></div>
    </div>

    <script>
      let canvas = document.querySelector("#unity-canvas");
      let activeUnityInstance = null;

      function showToast(msg) {
        const toast = document.getElementById("hudToast");
        if (!toast) return;
        toast.innerText = msg;
        toast.style.opacity = '1';
        setTimeout(() => { toast.style.opacity = '0'; }, 2400);
      }

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #dc2626; color:#fff; padding: 10px; border-radius:6px; font-size:12px;';
        else {
          if (type == 'warning') div.style = 'background: #d97706; color:#fff; padding: 10px; border-radius:6px; font-size:12px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      window.Module = window.Module || {};
      window.Module.arguments = [];
      window.Module.unityFileSystemInit = function() {};

      // Device & Performance Optimization Profile (Ensures smooth 60 FPS on low-spec phones & laptops)
      var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
      var isLowSpec = isMobile || 
                      (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) || 
                      (navigator.deviceMemory && navigator.deviceMemory <= 4);

      // Smart Hosting & Compression Detection:
      // GitHub Pages does not send Content-Encoding: gzip headers for precompressed files,
      // so uncompressed assets (.data, .framework.js, .wasm) are loaded for 100% zero-404 reliability.
      // Netlify and servers with gzip headers enabled can load .unityweb when requested.
      var urlParams = new URLSearchParams(window.location.search);
      var compressionParam = urlParams.get("compression");
      var isGitHubPages = window.location.hostname.includes("github.io") || window.location.protocol === "file:";
      var useUncompressed = compressionParam === "none" || (compressionParam !== "gzip" && (isGitHubPages || !window.location.hostname.includes("netlify.app")));

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + (useUncompressed ? "/WebGL.data" : "/WebGL.data.unityweb"),
        frameworkUrl: buildUrl + (useUncompressed ? "/WebGL.framework.js" : "/WebGL.framework.js.unityweb"),
        codeUrl: buildUrl + (useUncompressed ? "/WebGL.wasm" : "/WebGL.wasm.unityweb"),
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Holobridge",
        productName: "HOLOBRIDGE VR",
        productVersion: "0.2",
        showBanner: unityShowBanner,
        webglContextAttributes: {
          preserveDrawingBuffer: false,
          powerPreference: "high-performance",
          desynchronized: true
        }
      };

      // Adaptive Dynamic Canvas Resizing (Prevents GPU VRAM exhaustion on budget devices)
      function resizeCanvas() {
        var dpr = window.devicePixelRatio || 1;
        var renderScale = isLowSpec ? 1.0 : Math.min(dpr, 1.35);
        canvas.width = Math.floor(window.innerWidth * renderScale);
        canvas.height = Math.floor(window.innerHeight * renderScale);
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // =========================================================================
      // 1-FINGER VIRTUAL TOUCH JOYSTICK CONTROLLER
      // =========================================================================
      const joyZone = document.getElementById("touchJoystickZone");
      const joyThumb = document.getElementById("joystickThumb");
      const maxRadius = 45; // Max radius for dragging stick
      let joyActive = false;
      let joyTouchId = null;
      let joyCenter = { x: 0, y: 0 };
      let lastMoveSend = 0;
      let moveLoopTimer = null;
      let currentNormX = 0;
      let currentNormY = 0;

      function updateJoyCenter() {
        const rect = joyZone.getBoundingClientRect();
        joyCenter = {
          x: rect.left + rect.width * 0.5,
          y: rect.top + rect.height * 0.5
        };
      }

      function handleJoyStart(clientX, clientY) {
        joyActive = true;
        updateJoyCenter();
        handleJoyMove(clientX, clientY);

        if (!moveLoopTimer) {
          moveLoopTimer = setInterval(() => {
            if (joyActive && activeUnityInstance && (Math.abs(currentNormX) > 0.02 || Math.abs(currentNormY) > 0.02)) {
              activeUnityInstance.SendMessage("[HOLOBRIDGE_CROSS_DEVICE_HUB]", "OnWebTouchMove", currentNormX.toFixed(2) + "," + currentNormY.toFixed(2) + ",3.2");
            }
          }, 33); // ~30 Hz smooth transmission
        }
      }

      function handleJoyMove(clientX, clientY) {
        if (!joyActive) return;
        const dx = clientX - joyCenter.x;
        const dy = clientY - joyCenter.y;
        const dist = Math.hypot(dx, dy);
        const angle = Math.atan2(dy, dx);

        const clampedDist = Math.min(dist, maxRadius);
        const thumbX = Math.cos(angle) * clampedDist;
        const thumbY = Math.sin(angle) * clampedDist;

        joyThumb.style.transform = `translate(${thumbX}px, ${thumbY}px)`;

        // Invert Y because forward is negative screen Y
        currentNormX = thumbX / maxRadius;
        currentNormY = -(thumbY / maxRadius);
      }

      function handleJoyEnd() {
        joyActive = false;
        joyTouchId = null;
        currentNormX = 0;
        currentNormY = 0;
        joyThumb.style.transform = `translate(0px, 0px)`;

        if (moveLoopTimer) {
          clearInterval(moveLoopTimer);
          moveLoopTimer = null;
        }

        if (activeUnityInstance) {
          activeUnityInstance.SendMessage("[HOLOBRIDGE_CROSS_DEVICE_HUB]", "OnWebTouchMove", "0,0,0");
        }
      }

      // Touch Events for Mobile / Tablet
      joyZone.addEventListener("touchstart", (e) => {
        if (!joyActive) {
          const t = e.changedTouches[0];
          joyTouchId = t.identifier;
          handleJoyStart(t.clientX, t.clientY);
          e.preventDefault();
        }
      }, { passive: false });

      window.addEventListener("touchmove", (e) => {
        if (joyActive) {
          for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === joyTouchId) {
              handleJoyMove(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
              e.preventDefault();
              break;
            }
          }
        }
      }, { passive: false });

      window.addEventListener("touchend", (e) => {
        if (joyActive) {
          for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === joyTouchId) {
              handleJoyEnd();
              break;
            }
          }
        }
      });
      window.addEventListener("touchcancel", handleJoyEnd);

      // Mouse Events for Desktop Testing
      joyZone.addEventListener("mousedown", (e) => {
        if (e.button === 0) {
          handleJoyStart(e.clientX, e.clientY);
        }
      });
      window.addEventListener("mousemove", (e) => {
        if (joyActive && joyTouchId === null) {
          handleJoyMove(e.clientX, e.clientY);
        }
      });
      window.addEventListener("mouseup", (e) => {
        if (joyActive && joyTouchId === null) {
          handleJoyEnd();
        }
      });

      // Canvas Touch Laser Aiming
      canvas.addEventListener("touchmove", (e) => {
        if (activeUnityInstance && e.touches.length > 0) {
          const t = e.touches[0];
          if (t.identifier !== joyTouchId) {
            const rx = t.clientX / window.innerWidth;
            const ry = 1.0 - (t.clientY / window.innerHeight);
            activeUnityInstance.SendMessage("[HOLOBRIDGE_CROSS_DEVICE_HUB]", "OnWebLaserAim", rx.toFixed(3) + "," + ry.toFixed(3));
          }
        }
      }, { passive: true });

      // =========================================================================
      // PROCEDURAL WEB AUDIO SYNTHESIZER (ZERO-ASSET SCI-FI AUDIO)
      // =========================================================================
      const SpatialAudio = {
        ctx: null,
        init: function() {
          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) this.ctx = new AC();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(e=>{});
          }
        },
        playPing: function() {
          try {
            this.init();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(440, this.ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.31);
          } catch(e) {}
        },
        playWhoosh: function() {
          try {
            this.init();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(700, this.ctx.currentTime + 0.22);
            gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.23);
          } catch(e) {}
        },
        playAction: function() {
          try {
            this.init();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(520, this.ctx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.26);
          } catch(e) {}
        }
      };

      // Embedded Spectator Mode Detector
      const isEmbedded = (window.self !== window.top) || window.location.search.includes('embedded=1');
      if (isEmbedded) {
        document.body.classList.add('embedded-mode');
      }

      // =========================================================================
      // PERSPECTIVE & ACTION DISPATCHERS
      // =========================================================================
      function setCameraView(viewMode) {
        SpatialAudio.playWhoosh();
        document.querySelectorAll(".hub-btn").forEach(b => {
          if (b.id && b.id.startsWith("btn_")) b.classList.remove("active");
        });
        const activeBtn = document.getElementById("btn_" + viewMode);
        if (activeBtn) activeBtn.classList.add("active");

        if (activeUnityInstance) {
          activeUnityInstance.SendMessage("[HOLOBRIDGE_CROSS_DEVICE_HUB]", "OnWebSetCameraView", viewMode);
        }
        const names = {
          birds_eye: "🦅 BIRD'S EYE VIEW ACTIVATED",
          third_person: "👤 THIRD PERSON VIEW ACTIVATED",
          first_person: "🖥️ FIRST PERSON VIEW ACTIVATED",
          arena: "🌐 ARENA CAM OVERVIEW ACTIVATED"
        };
        showToast(names[viewMode] || viewMode.toUpperCase());
      }

      function triggerAction(action) {
        SpatialAudio.playAction();
        if (activeUnityInstance) {
          activeUnityInstance.SendMessage("[HOLOBRIDGE_CROSS_DEVICE_HUB]", "OnWebTriggerAction", action);
        }
        showToast("ACTION TRIGGERED: " + action.toUpperCase());
      }

      // =========================================================================
      // 🏆 AUTONOMOUS JUDGES DEMO TOUR (IEEE VR 2027 COMPETITION SHOWCASE)
      // =========================================================================
      let tourTimer = null;
      function startCinematicTour() {
        if (tourTimer) {
          clearInterval(tourTimer);
          tourTimer = null;
          showToast("⏹️ JUDGES TOUR STOPPED");
          return;
        }
        showToast("🏆 IEEE VR 2027 JUDGES DEMO TOUR STARTED");
        SpatialAudio.playAction();

        const steps = [
          { view: "birds_eye", action: "peel", toast: "🦅 STEP 1/4: BIRD'S EYE SPATIAL OVERVIEW", move: [0, 0.4] },
          { view: "arena", action: "explode", toast: "🌐 STEP 2/4: ARENA TACTICAL VIEW & EXPLODED TWIN", move: [0.5, 0] },
          { view: "third_person", action: "theme", toast: "👤 STEP 3/4: 3D HUMANOID AVATAR WALKING", move: [0, 0.5] },
          { view: "first_person", action: "xray", toast: "🖥️ STEP 4/4: FIRST-PERSON OPERATOR IMMERSION", move: [-0.4, 0] }
        ];

        let stepIndex = 0;
        function executeStep() {
          if (stepIndex >= steps.length) {
            clearInterval(tourTimer);
            tourTimer = null;
            setCameraView("third_person");
            showToast("🏆 IEEE VR TOUR COMPLETE! 3D CO-PRESENCE VERIFIED 100%");
            SpatialAudio.playPing();
            return;
          }
          const s = steps[stepIndex];
          setCameraView(s.view);
          if (s.action) triggerAction(s.action);
          showToast(s.toast);

          if (activeUnityInstance && s.move) {
            activeUnityInstance.SendMessage("[HOLOBRIDGE_CROSS_DEVICE_HUB]", "OnWebTouchMove", s.move[0] + "," + s.move[1] + ",2.8");
            setTimeout(() => {
              if (activeUnityInstance) {
                activeUnityInstance.SendMessage("[HOLOBRIDGE_CROSS_DEVICE_HUB]", "OnWebTouchMove", "0,0,0");
              }
            }, 2000);
          }
          stepIndex++;
        }

        executeStep();
        tourTimer = setInterval(executeStep, 4200);
      }

      // Direct postMessage channel for parent Controller Hub iframe
      window.addEventListener('message', function(e) {
        if (!e.data || typeof e.data !== 'object') return;
        if (e.data.type === 'move' && activeUnityInstance) {
          activeUnityInstance.SendMessage("[HOLOBRIDGE_CROSS_DEVICE_HUB]", "OnWebTouchMove", e.data.dx + "," + e.data.dy + ",3.2");
        } else if (e.data.type === 'view') {
          setCameraView(e.data.view);
        } else if (e.data.type === 'action') {
          triggerAction(e.data.action);
        } else if (e.data.type === 'tour') {
          startCinematicTour();
        } else if (e.data.type === 'ping') {
          SpatialAudio.playPing();
          showToast("📍 SPATIAL BEACON PING RECEIVED");
        }
      });

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(e => {});
        } else {
          document.exitFullscreen().catch(e => {});
        }
      }

      // =========================================================================
      // REAL-TIME GLOBAL TELEMETRY & MULTI-DEVICE MQTT PRESENCE
      // Enables unlimited devices worldwide to connect and be tracked live
      // =========================================================================
      const platformInfo = (function() {
        const ua = navigator.userAgent || "";
        let name = "🖥️ PC Browser";
        let icon = "🖥️";
        let type = "pc";
        if (/Oculus|Quest|Vive|Pico|VR/i.test(ua)) {
          name = "🥽 Meta Quest VR";
          icon = "🥽";
          type = "vr";
        } else if (/Android/i.test(ua)) {
          name = window.innerWidth > 600 ? "📱 Android Tablet" : "📱 Android Mobile";
          icon = "📱";
          type = "mobile";
        } else if (/iPhone/i.test(ua)) {
          name = "📱 Apple iPhone";
          icon = "📱";
          type = "mobile";
        } else if (/iPad/i.test(ua)) {
          name = "📱 Apple iPad";
          icon = "📱";
          type = "mobile";
        } else if (/Mac/i.test(ua)) {
          name = "💻 Apple Mac";
          icon = "💻";
          type = "pc";
        } else if (/Windows/i.test(ua)) {
          name = "🖥️ Windows PC";
          icon = "🖥️";
          type = "pc";
        }
        return { name: name, icon: icon, type: type, ua: ua };
      })();

      let deviceOpens = parseInt(localStorage.getItem("holobridge_open_count") || "0", 10) + 1;
      localStorage.setItem("holobridge_open_count", deviceOpens);

      let deviceId = localStorage.getItem("holobridge_device_id");
      if (!deviceId) {
        deviceId = "dev_" + platformInfo.type + "_" + Math.random().toString(36).substring(2, 8);
        localStorage.setItem("holobridge_device_id", deviceId);
      }

      let currentCameraViewMode = "third_person";
      let globalMqttClient = null;
      const mqttBrokers = [
        "wss://broker.hivemq.com:8884/mqtt",
        "wss://broker.emqx.io:8084/mqtt"
      ];
      let currentBrokerIndex = 0;

      function buildTelemetryPacket(evtType) {
        return {
          type: evtType,
          deviceId: deviceId,
          deviceName: platformInfo.name,
          platformType: platformInfo.type,
          icon: platformInfo.icon,
          resolution: window.innerWidth + "x" + window.innerHeight,
          deviceOpens: deviceOpens,
          activeView: currentCameraViewMode,
          timeZone: (Intl.DateTimeFormat && Intl.DateTimeFormat().resolvedOptions().timeZone) || "UTC",
          timestamp: Date.now(),
          url: window.location.href
        };
      }

      function initMqttTelemetry() {
        if (typeof mqtt === "undefined") {
          console.warn("[HoloBridge Telemetry] MQTT library not loaded, using BroadcastChannel only.");
          return;
        }
        const brokerUrl = mqttBrokers[currentBrokerIndex];
        try {
          globalMqttClient = mqtt.connect(brokerUrl, {
            clientId: "holo_node_" + deviceId + "_" + Math.random().toString(16).substring(2, 6),
            keepalive: 15,
            clean: true,
            reconnectPeriod: 4000,
            will: {
              topic: "holobridge/v1/presence/leave",
              payload: JSON.stringify({ deviceId: deviceId, timestamp: Date.now() }),
              qos: 0,
              retain: false
            }
          });

          globalMqttClient.on("connect", function() {
            console.log("[HoloBridge Telemetry] Connected to Global Broker:", brokerUrl);
            const beacon = document.querySelector(".beacon");
            if (beacon) beacon.style.background = "#00ff88";

            // Subscribe to commands and presence queries
            globalMqttClient.subscribe("holobridge/v1/commands/all");
            globalMqttClient.subscribe("holobridge/v1/commands/" + deviceId);
            globalMqttClient.subscribe("holobridge/v1/telemetry/query");

            // Announce join presence
            const joinPacket = buildTelemetryPacket("join");
            globalMqttClient.publish("holobridge/v1/presence/join", JSON.stringify(joinPacket));
          });

          globalMqttClient.on("message", function(topic, payload) {
            try {
              const msg = JSON.parse(payload.toString());
              if (topic === "holobridge/v1/telemetry/query") {
                const queryReply = buildTelemetryPacket("join");
                globalMqttClient.publish("holobridge/v1/presence/join", JSON.stringify(queryReply));
                return;
              }
              if (msg.target && msg.target !== "all" && msg.target !== deviceId) {
                return; // Targeted to another device
              }
              if (msg.type === "move" && activeUnityInstance) {
                activeUnityInstance.SendMessage("[HOLOBRIDGE_CROSS_DEVICE_HUB]", "OnWebTouchMove", msg.dx + "," + msg.dy + ",3.2");
              } else if (msg.type === "action" && activeUnityInstance) {
                activeUnityInstance.SendMessage("[HOLOBRIDGE_CROSS_DEVICE_HUB]", "OnWebTriggerAction", msg.action);
                showToast("⚡ REMOTE ACTION: " + msg.action.toUpperCase());
              } else if (msg.type === "view") {
                setCameraView(msg.view);
              }
            } catch(e) {}
          });

          globalMqttClient.on("error", function(err) {
            console.warn("[HoloBridge Telemetry] Broker error, cycling:", err);
            currentBrokerIndex = (currentBrokerIndex + 1) % mqttBrokers.length;
          });
        } catch(e) {
          console.warn("[HoloBridge Telemetry] Init error:", e);
        }
      }

      // Heartbeat loop (every 4s)
      setInterval(function() {
        if (globalMqttClient && globalMqttClient.connected) {
          const hb = buildTelemetryPacket("heartbeat");
          globalMqttClient.publish("holobridge/v1/presence/heartbeat", JSON.stringify(hb));
        }
      }, 4000);

      window.addEventListener("beforeunload", function() {
        if (globalMqttClient && globalMqttClient.connected) {
          globalMqttClient.publish("holobridge/v1/presence/leave", JSON.stringify({ deviceId: deviceId, timestamp: Date.now() }));
        }
      });

      // Start Telemetry
      initMqttTelemetry();

      // Cross-Tab Broadcast Synchronization with Controller Portal
      try {
        const hubChannel = new BroadcastChannel('holobridge_spatial_hub');
        setInterval(() => {
          hubChannel.postMessage({ type: 'heartbeat', online: true, count: 1, deviceId: deviceId, deviceName: platformInfo.name });
        }, 1000);
        hubChannel.onmessage = (e) => {
          if (!activeUnityInstance || !e.data) return;
          if (e.data.type === 'move') {
            activeUnityInstance.SendMessage("[HOLOBRIDGE_CROSS_DEVICE_HUB]", "OnWebTouchMove", e.data.dx + "," + e.data.dy + ",3.2");
          } else if (e.data.type === 'action') {
            activeUnityInstance.SendMessage("[HOLOBRIDGE_CROSS_DEVICE_HUB]", "OnWebTriggerAction", e.data.action);
          } else if (e.data.type === 'view') {
            setCameraView(e.data.view);
          }
        };
      } catch(e) {}

      // =========================================================================
      // UNITY INITIALIZATION
      // =========================================================================
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "flex";
            progressBarFull.style.width = (100 * progress) + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((instance) => {
          activeUnityInstance = instance;
          loadingContainer.style.display = "none";
          showToast("🌐 Connected to HoloBridge Spatial Engine!");

          // Auto-join as Web Operator
          setTimeout(() => {
            activeUnityInstance.SendMessage("[HOLOBRIDGE_CROSS_DEVICE_HUB]", "OnWebTriggerAction", "join");
          }, 800);
        }).catch((err) => {
          console.error("Unity WebGL loading error:", err);
          alert("Unity WebGL Error: " + err);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
